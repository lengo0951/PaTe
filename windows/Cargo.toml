[package]
name = "pasteflow-windows"
version = "1.2.0"
edition = "2021"
authors = ["Quốc Ngô <@lengo0951>"]
description = "Native Windows clipboard & credential manager built with Rust and Win32 APIs."

[[bin]]
name = "pasteflow"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.10", features = ["v4"] }
parking_lot = "0.12"

[build-dependencies]
embed-resource = "2.5"

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_Graphics_Dwm",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
    "Win32_Security_Cryptography",
    "Win32_System_Registry",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
